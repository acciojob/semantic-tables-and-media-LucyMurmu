<!DOCTYPE html>
<html lang="en">

<head>
    <title>Semantic Tables and Media</title>
</head>

<body>

    <table border="1">
        <thead>
            <tr>
                <th>Roll numbers</th>
                <th>Names</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Lucy</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Ankitesh</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Shruti</td>
            </tr>
        </tbody>
    </table>

    <h2>List of medias</h2>

    <ol>
        <li>
            <img src="https://picsum.photos/id/123/200/300"
                 alt="Random image">
        </li>

        <li>
            <video controls width="300">
                <source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                        type="video/mp4">
            </video>
        </li>

        <li>
            <audio controls>
                <source src="http://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg"
                        type="audio/ogg">
            </audio>
        </li>
    </ol>

</body>

</html>
